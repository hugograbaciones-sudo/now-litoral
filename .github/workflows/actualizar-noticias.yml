name: Actualizar noticias
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9,13,20 * * *"
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt
      - name: Reunir titulares RSS autorizados
        run: python scraper/publicar_noticias.py
      - name: Publicar el JSON actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/noticias.json
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para publicar."
          else
            git commit -m "Actualizar portada de noticias"
            git push
